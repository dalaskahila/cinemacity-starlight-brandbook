<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540"><title>Cinemacity Starlight — Solid colour palette</title><desc>Solid values from supplied Starlight guide SAB-04 page 5. RGB colour space. Proof print output separately.</desc><rect width="1000" height="540" fill="white"/><text x="40" y="68" font-family="Arial, sans-serif" font-size="27" fill="#5C1214">CINEMACITY STARLIGHT / COLOUR PALETTE</text><rect x="40" y="122" width="220" height="225" rx="24" fill="#5C1214"/><g fill="#5C1214" font-family="Arial, sans-serif"><text x="40" y="390" font-size="23">Burgundy</text><text x="40" y="420" font-size="16">#5C1214</text><text x="40" y="449" font-size="12">RGB 92 / 18 / 20</text><text x="40" y="478" font-size="12">PRIMARY</text></g><rect x="280" y="122" width="220" height="225" rx="24" fill="#FFE49F"/><g fill="#5C1214" font-family="Arial, sans-serif"><text x="280" y="390" font-size="23">Gold</text><text x="280" y="420" font-size="16">#FFE49F</text><text x="280" y="449" font-size="12">RGB 255 / 228 / 159</text><text x="280" y="478" font-size="12">SECONDARY</text></g><rect x="520" y="122" width="220" height="225" rx="24" fill="#221E1F"/><g fill="#5C1214" font-family="Arial, sans-serif"><text x="520" y="390" font-size="23">Onyx</text><text x="520" y="420" font-size="16">#221E1F</text><text x="520" y="449" font-size="12">RGB 34 / 30 / 31</text><text x="520" y="478" font-size="12">ACCENT 01</text></g><rect x="760" y="122" width="220" height="225" rx="24" fill="#35381E"/><g fill="#5C1214" font-family="Arial, sans-serif"><text x="760" y="390" font-size="23">Olive</text><text x="760" y="420" font-size="16">#35381E</text><text x="760" y="449" font-size="12">RGB 53 / 56 / 30</text><text x="760" y="478" font-size="12">ACCENT 02</text></g></svg>